<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Archivo;src:url(../src/assets/fonts/archivo-latin-standard-normal.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:"IBM Plex Mono";src:url(../src/assets/fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2");font-weight:500}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#0a111e}
.og{position:relative;width:1200px;height:630px;color:#eef1f6;font-family:Archivo,sans-serif}
.photo{position:absolute;inset:0 0 0 auto;width:640px;background:url(../src/assets/bilder/laden.webp) 50% 55%/cover}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0a111e 0%,rgba(10,17,30,.85) 28%,rgba(10,17,30,.35) 70%,rgba(10,17,30,.2) 100%)}
.text{position:absolute;left:72px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center}
.logo{width:470px;height:auto;display:block;margin-bottom:46px}
h1{font-weight:900;font-stretch:118%;font-size:68px;line-height:.98;letter-spacing:-.03em}
h1 span{color:#ff2a3d}
.meta{margin-top:30px;font:500 21px "IBM Plex Mono",monospace;color:#a9b4c8;letter-spacing:.01em}
.bar{position:absolute;left:0;right:0;bottom:0;height:12px;background:linear-gradient(90deg,#0e437e 0 50%,#e00018 50% 100%)}
</style></head><body>
<div class="og">
  <div class="photo"></div>
  <div class="text">
    <img class="logo" src="../src/assets/logo/iseler-logo-negativ.svg" alt="">
    <h1>Schnell. Einfach.<br><span>Direkt.</span></h1>
    <p class="meta">Kfz-Ersatzteile · Heusenstamm · seit 1978</p>
  </div>
  <div class="bar"></div>
</div>
</body></html>
